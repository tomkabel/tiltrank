name: test

# Push only on main: a branch with a PR open used to run every job twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny. Every job only checks out and runs tests.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The skill claims Python >=3.10 and ships stdlib-only. Test the floor,
        # or the claim is decoration.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ruff lint (rule set pinned here and in CLAUDE.md)
        run: |
          pip install ruff==0.17.3
          ruff check --select E4,E7,E9,F .claude/skills/tiltrank/scripts/ .github/scripts/

      - name: unit tests (validation, gating, ranking)
        run: python3 .claude/skills/tiltrank/scripts/test_rubric.py

      - name: protocol assertions (offline fixtures)
        run: python3 .claude/skills/tiltrank/scripts/eval/check_trace.py

      - name: install contract
        run: python3 .claude/skills/tiltrank/scripts/test_install_contract.py

      - name: skill contract (SKILL.md wording vs checker rules)
        run: python3 .claude/skills/tiltrank/scripts/test_skill_contract.py

      - name: no stray imports outside the stdlib
        run: python3 .github/scripts/stdlib_only.py .claude

  # Experimental, and deliberately not a dependency of the required `test`
  # check. continue-on-error on a matrix cell makes that job report success,
  # which would let a red macOS run satisfy the protected check name.
  tests-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests (validation, gating, ranking)
        run: python3 .claude/skills/tiltrank/scripts/test_rubric.py
      - name: protocol assertions (offline fixtures)
        run: python3 .claude/skills/tiltrank/scripts/eval/check_trace.py

  validate-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: validate skill frontmatter
        run: claude plugin validate .claude/skills

      - name: validate marketplace manifest
        run: claude plugin validate . --strict

  extension-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # No presence check: a deleted package.json must fail this job, not skip it.
      - name: install and typecheck
        run: cd extensions && npm ci && npx tsc --noEmit
      - name: extension tests (incl. sanitiser parity with rubric.py)
        run: node --experimental-strip-types --test --test-force-exit extensions/tiltrank.test.ts

  # Required status check named 'test': matrix jobs report as
  # 'tests (python)', which never satisfies the protected-context name, so
  # this aggregate job reports the bare 'test' check. always() + explicit
  # failure (instead of a skip) so a red upstream can never vacuously satisfy
  # the required check — skipped check runs count as passing.
  # tests-macos is not in needs: an experimental red cell must not fail, and
  # must not be able to pass, this check.
  test:
    needs: [tests, validate-skill, extension-typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: fail unless every required job above passed
        run: |
          echo "tests=${{ needs.tests.result }} validate-skill=${{ needs.validate-skill.result }} extension-typecheck=${{ needs.extension-typecheck.result }}"
          if [ "${{ needs.tests.result }}" != "success" ] \
             || [ "${{ needs.validate-skill.result }}" != "success" ] \
             || [ "${{ needs.extension-typecheck.result }}" != "success" ]; then
            echo "::error::a job in the test workflow did not succeed"
            exit 1
          fi
